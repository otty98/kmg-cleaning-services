<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kamgabaza Cleaning Services</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- HEADER -->
  <header>
    <h1>Kamgabaza Cleaning Services</h1>
    <p>Reliable, affordable, and professional cleaning for your home and office.</p>
    <button onclick="scrollToBooking()">Book a Service</button>
  </header>

  <!-- SERVICES SECTION -->
  <section class="services">
    <h2>Our Services</h2>

    <div class="service-list">
      <div class="card">House Cleaning</div>
      <div class="card">Deep Cleaning</div>
      <div class="card">Office Cleaning</div>
    </div>
  </section>

  <!-- BOOKING SECTION -->
  <section id="booking">
    <h2>Book a Service</h2>

    <form id="bookingForm">
      <input type="text" id="name" placeholder="Full Name" required />

      <input type="date" id="date" required />

      <input type="time" id="time" required />

      <select id="service" required>
        <option value="">Select Service</option>
        <option value="House Cleaning">House Cleaning</option>
        <option value="Deep Cleaning">Deep Cleaning</option>
        <option value="Office Cleaning">Office Cleaning</option>
      </select>

      <button type="submit">Submit Booking</button>
    </form>
  </section>

  <!-- BOOKINGS DISPLAY -->
  <section>
    <h2>Bookings</h2>
    <div id="bookingsList"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
